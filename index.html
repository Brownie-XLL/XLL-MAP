<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xbox LAN Legends Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- PapaParse -->
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <!-- MarkerCluster -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    // Turn URLs and Discord links into clickable links
    function linkify(text) {
      if (!text) return "";

      // Convert full URLs (http/https)
      let result = text.replace(/(https?:\/\/[^\s]+)/g, function(url) {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
      });

      // Convert Discord invite links (discord.gg/...)
      result = result.replace(/(discord\.gg\/[^\s]+)/gi, function(invite) {
        return `<a href="https://${invite}" target="_blank" rel="noopener noreferrer">${invite}</a>`;
      });

      return result;
    }

    // Your published Google Sheet CSV link
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQikAzD4Lthad2bFE3Y4TAsShUeWwOqk_jDKK9D6wSFl4_SJsKpeSWs7hdPJBFbKfM2JhTfF30UZLf5/pub?gid=0&single=true&output=csv";

    // Create the map
    const map = L.map('map').setView([39.96, -82.99], 7);
    const markers = L.markerClusterGroup();

    // Add map tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Load and plot the data
    Papa.parse(csvUrl, {
      download: true,
      header: true,
      complete: function(results) {
        const rows = results.data;

        rows.forEach(function(row) {
          const lat = parseFloat(row["Latitude"] || row["LAT"] || row["lat"]);
          const lng = parseFloat(row["Longitude"] || row["LONG"] || row["lng"] || row["lon"]);

          // Only add marker if we have valid coordinates
          if (!isNaN(lat) && !isNaN(lng)) {
            const name = row["Group/Organizer Name"] || "Unknown";
            const city = row["City"] || "";
            const state = row["State"] || "";
            const contact = row["Primary Contact"] || "";
            const platforms = row["Platforms"] || "";
            const games = row["Games"] || "";
            const notes = row["Notes"] || "";
            const visibility = row["Public or Private"] || "";

            const marker = L.marker([lat, lng]);
            markers.addLayer(marker);

            marker.bindPopup
