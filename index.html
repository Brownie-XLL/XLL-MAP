<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xbox LAN Legends Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    // Turn URLs and Discord links into clickable links
    function linkify(text) {
      if (!text) return "";
      let result = text.replace(/(https?:\/\/[^\s]+)/g, function(url) {
        return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
      });
      result = result.replace(/(discord\.gg\/[^\s]+)/gi, function(invite) {
        return `<a href="https://${invite}" target="_blank" rel="noopener noreferrer">${invite}</a>`;
      });
      return result;
    }

    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQikAzD4Lthad2bFE3Y4TAsShUeWwOqk_jDKK9D6wSFl4_SJsKpeSWs7hdPJBFbKfM2JhTfF30UZLf5/pub?gid=0&single=true&output=csv";

const map = L.map('map').setView([39.96, -82.99], 7);
const markers = L.markerClusterGroup();
let allMarkers = []; // store markers for searching

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// ===== SEARCH BOX =====
const searchControl = L.control({ position: 'bottomleft' });

searchControl.onAdd = function () {
  const div = L.DomUtil.create('div', 'search-box');
  div.innerHTML = `
    <input id="searchInput" type="text" placeholder="Search name, city, or state..." 
      style="padding: 8px 12px; width: 220px; border: 1px solid #ccc; border-radius: 4px 0 0 4px; outline: none; font-size: 14px;">
    <button id="searchBtn" 
      style="padding: 8px 14px; background: #00ff66; color: #111; border: none; border-radius: 0 4px 4px 0; cursor: pointer; font-weight: 700;">
      Search
    </button>
  `;
  
  // Prevent map clicks when interacting with the search box
  L.DomEvent.disableClickPropagation(div);
  return div;
};

searchControl.addTo(map);

// Search function
// Full state name mapping
const stateNames = {
  "al": "alabama", "ak": "alaska", "az": "arizona", "ar": "arkansas", "ca": "california",
  "co": "colorado", "ct": "connecticut", "de": "delaware", "fl": "florida", "ga": "georgia",
  "hi": "hawaii", "id": "idaho", "il": "illinois", "in": "indiana", "ia": "iowa",
  "ks": "kansas", "ky": "kentucky", "la": "louisiana", "me": "maine", "md": "maryland",
  "ma": "massachusetts", "mi": "michigan", "mn": "minnesota", "ms": "mississippi", "mo": "missouri",
  "mt": "montana", "ne": "nebraska", "nv": "nevada", "nh": "new hampshire", "nj": "new jersey",
  "nm": "new mexico", "ny": "new york", "nc": "north carolina", "nd": "north dakota", "oh": "ohio",
  "ok": "oklahoma", "or": "oregon", "pa": "pennsylvania", "ri": "rhode island", "sc": "south carolina",
  "sd": "south dakota", "tn": "tennessee", "tx": "texas", "ut": "utah", "vt": "vermont",
  "va": "virginia", "wa": "washington", "wv": "west virginia", "wi": "wisconsin", "wy": "wyoming"
};

function runSearch() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!query) return;

  const matches = allMarkers.filter(item => {
    const stateAbbr = item.state.toLowerCase();
    const fullStateName = stateNames[stateAbbr] || "";

    return (
      item.name.toLowerCase().includes(query) ||
      item.city.toLowerCase().includes(query) ||
      stateAbbr.includes(query) ||
      fullStateName.includes(query)
    );
  });

  if (matches.length === 0) {
    alert("No matching organizers found.");
    return;
  }

  if (matches.length === 1) {
    map.flyTo(matches[0].marker.getLatLng(), 10);
    matches[0].marker.openPopup();
  } else {
    const group = L.featureGroup(matches.map(m => m.marker));
    map.fitBounds(group.getBounds().pad(0.2));
  }
}

// Attach search events after the control is added
setTimeout(() => {
  document.getElementById('searchBtn').addEventListener('click', runSearch);
  document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') runSearch();
  });
}, 100);

// ===== LOAD DATA =====
Papa.parse(csvUrl, {
  download: true,
  header: true,
  complete: function(results) {
    const rows = results.data;

    rows.forEach(function(row, index) {
      const lat = parseFloat(row["Latitude"] || row["LAT"] || row["lat"]);
      const lng = parseFloat(row["Longitude"] || row["LONG"] || row["lng"] || row["lon"]);

      if (!isNaN(lat) && !isNaN(lng)) {
        const name = row["Group/Organizer Name"] || "Unknown";
        const city = row["City"] || "";
        const state = row["State"] || "";
        const contact = row["Primary Contact"] || "";
        const platforms = row["Platforms"] || "";
        const games = row["Games"] || "";
        const notes = row["Notes"] || "";
        const visibility = row["Public or Private"] || "";

        const marker = L.marker([lat, lng]);
        markers.addLayer(marker);

        // Store for searching
        allMarkers.push({
          marker: marker,
          name: name,
          city: city,
          state: state
        });

        marker.bindPopup(`
          <div style="font-family: Arial, sans-serif; min-width: 220px;">
            <div style="
              background: #0a0a0a;
              color: #00ff66;
              padding: 10px 12px;
              margin: -14px -14px 12px -14px;
              border-radius: 8px 8px 0 0;
              display: flex;
              align-items: center;
              gap: 10px;
              border-bottom: 2px solid #00ff66;
            ">
              <img src="xll-icon.png" style="width:64px; height:64px; border-radius:6px; flex-shrink:0;">
              <div style="font-size: 14px; font-weight: 700; letter-spacing: 0.3px; line-height: 1.2;">
                XBOX LAN<br>LEGENDS MAP
              </div>
            </div>

            <div style="padding: 0 2px 6px 2px;">
<!-- Name & Location + Badge -->
<div style="
  background: #000;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
">
  <!-- Name + City (left/center) -->
  <div style="text-align: center; flex-grow: 1;">
    <div style="
      font-size: 24px;
      font-weight: 800;
      font-family: Impact, Haettenschweiler, 'Arial Black', sans-serif;
      letter-spacing: 0.5px;
      color: #00ff66;
      margin-bottom: 3px;
      text-transform: uppercase;
    ">${name}</div>
    <div style="color: #ccc; font-size: 13px; font-weight: 600;">
      ${city}, ${state}
    </div>
  </div>

  <!-- OG Spartan Badge (right side) - only for first 10 -->
  ${index < 10 ? `
    <img src="og-spartan-badge.png" 
         style="width: 80px; height: 80px; border-radius: 50%; flex-shrink: 0;" 
         alt="OG Spartan">
  ` : ''}
</div>

              <div style="font-size: 13px; line-height: 1.6;">
                <div style="margin-bottom: 6px;"><strong>Contact:</strong> ${linkify(contact)}</div>
                <div style="margin-bottom: 6px;">
                  <strong>Access:</strong>
                  <span style="font-weight:700; color: ${
                    visibility.toLowerCase().includes('private') ? '#e74c3c' :
                    visibility.toLowerCase().includes('semi') ? '#e67e22' :
                    '#27ae60'
                  };">
                    ${visibility || 'Not specified'}
                  </span>
                </div>
                <div style="margin-bottom: 6px;"><strong>Platforms:</strong> ${platforms}</div>
                <div style="margin-bottom: 6px;"><strong>Games:</strong> ${games}</div>
                <div><strong>Notes:</strong> ${linkify(notes)}</div>
              </div>
            </div>
          </div>
        `, { maxWidth: 300 });
      }
    });

    map.addLayer(markers);
    console.log("Loaded " + rows.length + " rows from the sheet");
  },
  error: function(err) {
    console.error("Error loading CSV:", err);
    alert("Could not load the organizer data. Check the published CSV link.");
  }
});
  </script>

</body>
</html>
